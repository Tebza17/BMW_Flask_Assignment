kraft:
  enabled: true

zookeeper:
  enabled: false

controller:
  replicaCount: 1

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT

provisioning:
  enabled: true
  topics:
    - name: events
      partitions: 1
      replicationFactor: 1
